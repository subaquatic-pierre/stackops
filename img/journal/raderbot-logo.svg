<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="50%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#070A0F"/>
    </linearGradient>

    <!-- Radar Glow -->
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#00F2FE" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Rust Accent Gradient -->
    <linearGradient id="rustOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E62"/>
      <stop offset="100%" stop-color="#FF9966"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Right Side: Radar & Market Visuals -->
  <g transform="translate(850, 315)">
    <!-- Radar Outer Rings -->
    <circle r="240" fill="url(#radarGlow)"/>
    <circle r="240" fill="none" stroke="#1E293B" stroke-width="2"/>
    <circle r="180" fill="none" stroke="#00F2FE" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle r="120" fill="none" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle r="60" fill="none" stroke="#00F2FE" stroke-opacity="0.2" stroke-width="1"/>
    
    <!-- Crosshairs -->
    <line x1="-260" y1="0" x2="260" y2="0" stroke="#00F2FE" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="0" y1="-260" x2="0" y2="260" stroke="#00F2FE" stroke-opacity="0.2" stroke-width="1"/>

    <!-- Radar Sweep Cone -->
    <path d="M 0 0 L 170 -170 A 240 240 0 0 1 240 0 Z" fill="url(#sweep)"/>
    <line x1="0" y1="0" x2="170" y2="-170" stroke="#00F2FE" stroke-width="2" stroke-opacity="0.8"/>

    <!-- Candlesticks overlaying radar -->
    <!-- Green Candle 1 -->
    <g transform="translate(-130, 40)">
      <line x1="0" y1="-30" x2="0" y2="50" stroke="#10B981" stroke-width="2"/>
      <rect x="-8" y="-15" width="16" height="45" fill="#10B981" rx="2"/>
    </g>
    <!-- Red Candle 1 -->
    <g transform="translate(-80, 10)">
      <line x1="0" y1="-40" x2="0" y2="30" stroke="#EF4444" stroke-width="2"/>
      <rect x="-8" y="-20" width="16" height="35" fill="#EF4444" rx="2"/>
    </g>
    <!-- Green Candle 2 -->
    <g transform="translate(-30, -40)">
      <line x1="0" y1="-50" x2="0" y2="40" stroke="#10B981" stroke-width="2"/>
      <rect x="-8" y="-35" width="16" height="55" fill="#10B981" rx="2"/>
    </g>
    <!-- Green Candle 3 (Blip target) -->
    <g transform="translate(30, -90)">
      <line x1="0" y1="-40" x2="0" y2="30" stroke="#00F2FE" stroke-width="2"/>
      <rect x="-8" y="-25" width="16" height="40" fill="#00F2FE" rx="2"/>
      <circle cx="0" cy="-5" r="18" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.6"/>
    </g>
    <!-- Red Candle 2 -->
    <g transform="translate(80, -30)">
      <line x1="0" y1="-20" x2="0" y2="60" stroke="#EF4444" stroke-width="2"/>
      <rect x="-8" y="0" width="16" height="40" fill="#EF4444" rx="2"/>
    </g>
    <!-- Green Candle 4 -->
    <g transform="translate(130, -70)">
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#10B981" stroke-width="2"/>
      <rect x="-8" y="-15" width="16" height="30" fill="#10B981" rx="2"/>
    </g>
  </g>

  <!-- Left Side: Branding and Details -->
  <g transform="translate(100, 150)">
    <!-- Language / Tech Tag -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="110" height="28" rx="14" fill="#FF5E62" fill-opacity="0.15" stroke="#FF5E62" stroke-opacity="0.4" stroke-width="1"/>
      <text x="55" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FF8866" text-anchor="middle" letter-spacing="1.5">RUST ENGINE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      Raderbot
    </text>

    <!-- Subtitle -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94A3B8" width="500">
      High-Performance Algorithmic Trading &amp; Market Analysis
    </text>

    <!-- Key Tech Badges -->
    <g transform="translate(0, 210)">
      <!-- Actix / WebSockets -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="150" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="18" r="4" fill="#00F2FE"/>
        <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Actix WebSockets</text>
      </g>

      <!-- Multi-Exchange -->
      <g transform="translate(162, 0)">
        <rect x="0" y="0" width="140" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="18" r="4" fill="#10B981"/>
        <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Binance / BingX</text>
      </g>

      <!-- Real-time Streams -->
      <g transform="translate(314, 0)">
        <rect x="0" y="0" width="140" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <circle cx="20" cy="18" r="4" fill="#F59E0B"/>
        <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Backtesting Engine</text>
      </g>
    </g>

    <!-- Code/Terminal Snippet Visual -->
    <g transform="translate(0, 285)">
      <rect x="0" y="0" width="450" height="80" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <!-- Window Dots -->
      <circle cx="18" cy="16" r="4" fill="#EF4444" opacity="0.7"/>
      <circle cx="30" cy="16" r="4" fill="#F59E0B" opacity="0.7"/>
      <circle cx="42" cy="16" r="4" fill="#10B981" opacity="0.7"/>
      <!-- Terminal Text -->
      <text x="18" y="44" font-family="monospace" font-size="12" fill="#64748B">$ <tspan fill="#E2E8F0">cargo run --release</tspan></text>
      <text x="18" y="62" font-family="monospace" font-size="12" fill="#10B981">[INFO] Raderbot active streams initialized [Dry Mode]</text>
    </g>
  </g>
</svg>
